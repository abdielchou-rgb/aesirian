[project]
name = "aesirian-core"
version = "0.2.0"
description = "Æsirian — 超级智能叙事系统核心引擎"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.22",
    "transformers>=4.40",
    "torch>=2.3",
    "accelerate>=0.30",
    "pydantic-ai>=0.3.0",
    "logfire>=3.0",
    "fastmcp>=0.2.0",
    "mcp>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "alembic>=1.13",
    "structlog>=24.1",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
electron = ["fastapi>=0.100", "uvicorn>=0.23"]
test = ["pytest>=7.0", "hypothesis>=6.0", "pytest-asyncio>=0.23"]
dev = ["ruff>=0.4", "mypy>=1.10", "pre-commit>=3.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# tests/l3_browser_test.py 为独立运行脚本（python tests/l3_browser_test.py，需 playwright），
# 非 pytest 单测文件；限制收集规则避免其 import 期依赖缺失阻塞全量收集。
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "PTH", "ERA", "RET", "ARG", "FLY", "NPY", "PERF", "TRY", "TID", "LOG"]
ignore = ["S101", "TRY003", "ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true