[project]
name = "aesirian-core"
version = "0.2.0"
description = "Æsirian — 超级智能叙事系统核心引擎"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.22",
    "ebooklib>=0.18",
    "transformers>=4.40",
    "torch>=2.3",
    "accelerate>=0.30",
    "pydantic-ai>=0.3.0",
    "logfire>=3.0",
    "fastmcp>=0.2.0",
    "mcp>=1.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "alembic>=1.13",
    "structlog>=24.1",
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
electron = ["fastapi>=0.100", "uvicorn>=0.23"]
test = ["pytest>=7.0", "hypothesis>=6.0", "pytest-asyncio>=0.23"]
dev = ["ruff>=0.4", "mypy>=1.10", "pre-commit>=3.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# tests/l3_browser_test.py 为独立运行脚本（python tests/l3_browser_test.py，需 playwright），
# 非 pytest 单测文件；限制收集规则避免其 import 期依赖缺失阻塞全量收集。
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 说明（0.2.1 全量 gate 基线）：
# - 移出 select：T20(print)/PTH(pathlib) —— 项目采用 print+os.path 既有风格，
#   CONTRIBUTING 已说明；专项迁移列入后续技术债。
# - ignore 追加：E501(长字符串/数据行不随 format 断行)、E402(顶层 sys.path+延迟导入为独立运行所需，
#   遍布 core 入口/tools/mcp)、F403(registry 星号再导出)。
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ERA", "RET", "ARG", "FLY", "NPY", "PERF", "TRY", "TID", "LOG"]
ignore = ["S101", "TRY003", "ARG001", "ARG002", "E501", "E402", "F403"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "fastapi.Cookie", "fastapi.Form", "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# __init__.py 承担公共再导出（registry/包 API）
"**/__init__.py" = ["F401", "F405"]
# wenjian 门禁：GateResult 仅在 PEP563 延迟注解中出现（运行期仅 base.py 构造，已正确导入）
"core/wenjian/audit/gates/*.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true