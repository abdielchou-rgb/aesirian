# Æsirian CI
# 0.2.0+ 质量基线：test(3×矩阵) + ruff 全量 + mypy core 全量，三者均为硬性绿。
# 说明：
# 1) ruff 全量 gate 范围 = 工程源码 core bridge tools tests mcp_server*.py（.scratch/archive/docs 不在范围）。
#    select 已剔除 T20(print)/PTH(pathlib)（既有风格）并忽略 E501/E402/F403，见 pyproject.toml [tool.ruff.lint]。
# 2) mypy core/ 全量 gate：python_version=3.12（numpy>=2 PEP695 stub 解析）、strict_optional 保留、
#    untyped def/隐式 Optional 豁免（legacy 基线），见 pyproject.toml [tool.mypy]。
# 3) 项目测试不需要 editable 安装（tests 直接从仓库根 import core/...），pyproject requires-python=">=3.11"，
#    Python 3.10 矩阵成员使用 requirements.txt 直装 + 源码根运行。
# 4) 排除 tests/l3_browser_test.py（需 Windows + Electron，CI Ubuntu 上不可跑）。
# 5) transformers NER 在无网络 runner 上快速降级：设置 HF_HUB_OFFLINE / TRANSFORMERS_OFFLINE。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PY_COLORS: "1"

jobs:
  # ---- 主矩阵：pytest 109 绿基线（Python 3.10 / 3.11 / 3.12） ----
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (requirements.txt, no editable install)
        run: pip install -r requirements.txt

      - name: Verify 7 sandbox fixes (M1-2 compat matrix)
        run: python tools/compat_matrix_check.py

      - name: Run pytest suite (L3 browser excluded)
        run: python -m pytest tests/ --ignore=tests/l3_browser_test.py -q

  # ---- ruff：全量 gate（工程源码范围） ----
  ruff:
    name: ruff (full-repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Lint engineering source (full gate)
        run: ruff check --output-format=github core bridge tools tests mcp_server.py mcp_server_fast.py

  # ---- mypy：core/ 全量 gate ----
  mypy:
    name: mypy (core full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mypy
        run: pip install "mypy>=1.10"

      - name: Type-check core/ (full gate)
        run: mypy core/ --ignore-missing-imports
