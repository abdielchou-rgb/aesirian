# Æsirian M1-2 Python 3.10–3.13 兼容矩阵（tox）
# 依据 docs/engineering-plan-v11.md §3.1 M1-2 与 docs/roundtable-20260905.md 附录 A。
#
# 验收口径：Python 3.10 / 3.11 / 3.12 全量 pytest 全绿（本机 109 passed）。
# 3.13：本地装有 3.13 解释器时可手动执行 `tox -e py313` 验证；默认 env_list 不含（依赖 wheel 生态保守）。
#
# 7 处沙箱修复固化策略：
#   roundtable-20260905 附录 A 的 7 处修复（datetime.UTC×3 → timezone.utc、OpenAIChatModel/
#   models.gemini→google 改名、in-memory 共享引擎、llm_used NameError、StaticPool 依赖、tests 断言）
#   已全部固化进代码与 tests（109 绿用例内）。本矩阵通过两重验证把它们变成「每次多版本回归都必跑」的项：
#   1) tools/compat_matrix_check.py —— 文本级静态断言（无 datetime.UTC 残留、timezone.utc /
#      StaticPool / _memory_engine / _build_engine / create_all / models.google / OpenAIChatModel /
#      llm_used 初始化 / test_e2e 共享引擎断言 / test_core INFERENCE 断言），任何一项回退立即红；
#   2) python -m pytest tests/（排除 l3_browser）—— 7 处修复的运行期回归（py3.10 上任何
#      datetime.UTC / 旧 pydantic-ai 改名残留都会导致 AttributeError/ImportError 全红）。
#
# 运行方式（tox >= 4）：
#   tox -e py310 -e py311 -e py312     # 或直接 tox
# 本地缺少某个解释器时由 skip_missing_interpreters 自动跳过；CI 矩阵（.github/workflows/ci.yml）
# 覆盖同样的 3.10/3.11/3.12 三版本，保证远程真实全绿。

[tox]
env_list = py310, py311, py312
skip_missing_interpreters = true

[testenv]
# 项目以「源码在仓库根、pytest 从根运行」方式工作（tests 直接 import core/...、根级 tom_engine 等），
# 无需 editable 安装包本身；requirements.txt 为与 CI 一致的全量依赖清单。
# 注意：pyproject.toml requires-python=">=3.11"，故 Python 3.10 成员刻意不做 pip install -e .
#       （editable 安装会因 requires-python 被拒），直接以 requirements.txt 装依赖 + 源码根运行，
#       从而在不动 uv.lock / pyproject 的前提下真实执行 3.10 全量回归。
skip_install = true
deps = -rrequirements.txt

# transformers NER 离线快速降级（与全局约定一致）
set_env =
    HF_HUB_OFFLINE = 1
    TRANSFORMERS_OFFLINE = 1

commands =
    python tools/compat_matrix_check.py
    python -m pytest tests/ --ignore=tests/l3_browser_test.py -q
