# Alembic Configuration
# Generated by alembic init, customized for Æsirian

[alembic]
# Template for migration scripts
script_location = alembic
# Version file location
version_locations = alembic/versions
# SQLAlchemy URL (overridden by env.py)
sqlalchemy.url = sqlite:///aesirian.db

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S